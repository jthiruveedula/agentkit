<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Prompt Analytics walkthrough</title>
<script src="vendor/gsap.min.js"></script>
<script src="data.js"></script>
<style>
@font-face{font-family:"Big Shoulders Display";font-weight:900;src:url(assets/fonts/big-shoulders-display-900.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(assets/fonts/ibm-plex-mono-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(assets/fonts/ibm-plex-mono-500.woff2) format("woff2")}
:root{--paper:#DDF0FB;--ink:#0E1F2C;--ink2:#2E3F4F;--reg:#0A5FC4;--ui:#44596B;--rule:#B5D3E6;--fx:#22C3EE;--warn:#B4501E;
--f1:"Big Shoulders Display",sans-serif;--f2:"IBM Plex Mono",ui-monospace,Menlo,monospace;
--sans:ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:var(--sans);color:var(--ink)}
.clip{position:absolute;inset:0}
#bg{background:linear-gradient(160deg,#CFEAFA 0%,#DDF0FB 45%,#C3E6F8 100%);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(40px)}
.b1{left:-200px;top:-150px;width:1000px;height:800px;background:radial-gradient(closest-side,rgba(34,195,238,.62),transparent)}
.b2{right:-250px;bottom:-250px;width:1200px;height:900px;background:radial-gradient(closest-side,rgba(10,95,196,.30),transparent)}
.b3{left:700px;top:-300px;width:900px;height:700px;background:radial-gradient(closest-side,rgba(60,215,255,.45),transparent)}
.ray{position:absolute;left:-200px;right:-200px;top:0;height:1080px;opacity:.5;background:repeating-linear-gradient(115deg,transparent 0 120px,rgba(255,255,255,.35) 120px 150px,transparent 150px 300px);filter:blur(18px)}
.scene{padding:90px 120px 0}
.card{background:rgba(236,248,255,.74);border-radius:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.6),18px 28px 48px -26px rgba(44,110,140,.34),2px 3px 6px -2px rgba(20,45,65,.12)}
.eyebrow{font:500 26px/1 var(--f2);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.cap{position:absolute;left:0;right:0;bottom:70px;display:flex;justify-content:center}
.cap span{display:block;padding:18px 40px;border-radius:999px;font:400 38px/1.2 var(--sans);color:var(--ink);background:rgba(236,248,255,.86);box-shadow:inset 0 0 0 1px rgba(14,31,44,.08),0 14px 30px -18px rgba(44,110,140,.4)}
.num{font-family:var(--f1);font-weight:900;font-variant-numeric:tabular-nums;line-height:.85;color:var(--ink)}
.mono{font-family:var(--f2)}

#stage-l{overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;border-radius:8px;background:#fff;box-shadow:0 30px 80px -30px rgba(20,60,90,.55);overflow:hidden}
#stage img,#gl{position:absolute;left:0;top:0;width:1440px;height:900px;opacity:0}
.fx{position:absolute;inset:0;pointer-events:none}
.ring{position:absolute;border-radius:14px;border:4px solid var(--reg);box-shadow:0 0 0 6px rgba(10,95,196,.18),0 0 40px rgba(34,195,238,.5);opacity:0}
.tag{position:absolute;padding:10px 22px;border-radius:999px;background:var(--reg);color:#fff;font:500 26px/1 var(--f2);white-space:nowrap;opacity:0;box-shadow:0 10px 24px -10px rgba(10,95,196,.7)}
.step{position:absolute;right:56px;top:36px;padding:14px 28px 14px 18px;border-radius:999px;background:rgba(236,248,255,.92);font:500 28px/1 var(--f2);color:var(--ink);display:flex;gap:16px;align-items:center;opacity:0;box-shadow:inset 0 0 0 1px rgba(14,31,44,.08),0 14px 30px -18px rgba(44,110,140,.5)}
.step b{display:inline-flex;width:48px;height:48px;border-radius:50%;background:var(--reg);color:#fff;align-items:center;justify-content:center;font:500 28px var(--f2)}
.capw{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center}
.capw span{position:absolute;bottom:0;padding:16px 38px;border-radius:999px;font:400 36px/1.2 var(--sans);color:var(--ink);background:rgba(236,248,255,.94);box-shadow:inset 0 0 0 1px rgba(14,31,44,.08),0 14px 30px -18px rgba(44,110,140,.4);white-space:nowrap;opacity:0}
#cur{position:absolute;left:0;top:0;width:44px;height:44px;opacity:0;filter:drop-shadow(0 6px 8px rgba(14,31,44,.45))}
.rip{position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;border:5px solid var(--fx);background:rgba(34,195,238,.25);opacity:0}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:120px}
.ov h1,.ov h2{font:300 124px/1.02 var(--sans);letter-spacing:-.035em;max-width:1560px;margin-top:30px}
.ov em{font-style:normal;color:var(--reg)}
.ov .sub{margin-top:40px;font:400 38px var(--f2);color:var(--ink2)}
.ov .cmd{margin-top:56px;padding:34px 56px;border-radius:999px;font:500 56px var(--f2)}
.ov .cmd span{color:var(--reg)}
.ov .priv{margin-top:34px;font:500 24px var(--f2);letter-spacing:.06em;text-transform:uppercase;color:var(--ui)}
#introw,#outrow{position:absolute;inset:0}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="72.9" data-width="1920" data-height="1080" data-motion-blur="on" data-motion-blur-shutter="180" data-motion-blur-events="on">
  <div id="bg" class="clip" data-layout-allow-overflow data-start="0" data-duration="72.9" data-track-index="0"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="ray"></div></div>
  <div id="stage-l" class="clip" data-layout-allow-overflow data-start="0" data-duration="72.9" data-track-index="1"><div id="stage"></div></div>
  <div id="fx" class="clip fx" data-layout-allow-overflow data-start="0" data-duration="72.9" data-track-index="2"></div>
  <div id="intro" class="clip" data-start="0" data-duration="3.0" data-track-index="3"><div id="introw" class="ov">
    <div class="eyebrow" id="ie">Prompt Analytics</div>
    <h1 id="ih">Where do your AI coding <em>hours</em> go?</h1>
    <div class="sub" id="is">A local dashboard walkthrough</div></div></div>
  <div id="outro" class="clip" data-start="68.9" data-duration="4.0" data-track-index="3"><div id="outrow" class="ov">
    <h2 id="oh">Know where your <em>hours</em> go.</h2>
    <div class="cmd card" id="oc"><span>$</span> uvx prompt-analytics run</div>
    <div class="priv" id="op">Local-first. Nothing leaves your machine.</div></div></div>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="data.js"></script>
<script>
window.__timelines = window.__timelines || {};
const P = window.PA, S = P.scenes, tl = gsap.timeline({ paused: true });
const stage = document.getElementById("stage"), fx = document.getElementById("fx");
const mk = (cls, parent, html) => { const e = document.createElement("div"); e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e; };
const camFor = (b) => {
  if (!b) return { k: 1.2, x: 96, y: 0 };
  let k = Math.min(1700 / b.w, 880 / b.h); k = Math.max(1.2, Math.min(2.2, k));
  let x = 960 - k * (b.x + b.w / 2), y = 500 - k * (b.y + b.h / 2);
  x = 1440 * k >= 1920 ? Math.min(0, Math.max(1920 - 1440 * k, x)) : (1920 - 1440 * k) / 2;
  y = 900 * k >= 1080 ? Math.min(0, Math.max(1080 - 900 * k, y)) : (1080 - 900 * k) / 2;
  return { k, x, y };
};
const toRoot = (c, px, py) => [c.x + c.k * px, c.y + c.k * py];
const imgs = {};
S.forEach((s) => { if (s.shot && !imgs[s.shot]) { const i = document.createElement("img"); i.src = "shots/" + s.shot + ".png"; stage.appendChild(i); imgs[s.shot] = i; } });
// Chapter breaks: a WebGL zoom-blur transition (shader adapted from the HyperFrames registry block
// cinematic-zoom) between two shot PNGs. The canvas lives inside #stage, so it rides the camera.
const CHAP = new Set(["tools", "models", "exposure", "map"]);
const glc = document.createElement("canvas"); glc.id = "gl"; glc.width = 1440; glc.height = 900; stage.appendChild(glc);
const gl = glc.getContext("webgl", { preserveDrawingBuffer: true });
const zoomT = gl && (() => {
  const sh = (src, type) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh("attribute vec2 a;varying vec2 v;void main(){v=a*.5+.5;v.y=1.-v.y;gl_Position=vec4(a,0,1);}", gl.VERTEX_SHADER));
  gl.attachShader(prog, sh("precision mediump float;varying vec2 v;uniform sampler2D A,B;uniform float p;" +
    "vec3 bl(sampler2D t,vec2 d,float s,float dir){vec3 c=vec3(0.);for(int i=0;i<16;i++){float f=float(i)/16.;" +
    "c+=vec3(texture2D(t,v+dir*d*s*1.08*f).r,texture2D(t,v+dir*d*s*f).g,texture2D(t,v+dir*d*s*.92*f).b);}return c/16.;}" +
    "void main(){vec2 d=v-vec2(.5);gl_FragColor=vec4(mix(bl(A,d,p*.22,-1.),bl(B,d,(1.-p)*.16,1.),smoothstep(.25,.75,p)),1.);}", gl.FRAGMENT_SHADER));
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.uniform1i(gl.getUniformLocation(prog, "A"), 0); gl.uniform1i(gl.getUniformLocation(prog, "B"), 1);
  const uP = gl.getUniformLocation(prog, "p"), texs = new Map();
  const tex = (img) => {
    if (!texs.has(img)) {
      const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
      for (const [k, v] of [[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE], [gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img); texs.set(img, t);
    }
    return texs.get(img);
  };
  const draw = (a, b, p) => {
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex(a));
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tex(b));
    gl.uniform1f(uP, p); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  };
  return (a, b, at, d) => {
    const pr = { p: 0 };
    tl.set(glc, { opacity: 1 }, at); tl.set(a, { opacity: 0 }, at);
    tl.fromTo(pr, { p: 0 }, { p: 1, duration: d, ease: "power2.inOut", immediateRender: false, onUpdate: () => draw(a, b, pr.p) }, at);
    tl.set(b, { opacity: 1 }, at + d); tl.set(glc, { opacity: 0 }, at + d);
  };
})();
tl.set(glc, { opacity: 0 }, 0);
const cur = mk("", fx, ""); cur.id = "cur";
cur.innerHTML = '<svg viewBox="0 0 44 44" width="44" height="44"><path d="M4 2 L4 33 L12 26 L18 40 L24 37 L18 24 L29 24 Z" fill="#fff" stroke="#0E1F2C" stroke-width="2.4" stroke-linejoin="round"/></svg>';
const stepEls = [], capEls = [];
gsap.set(stage, { transformOrigin: "0 0" });
let base = camFor(null);
tl.set(stage, { x: base.x, y: base.y, scale: base.k, opacity: 0 }, 0);
tl.set(cur, { x: 0, y: 0, opacity: 0 }, 0);
let t0 = 0, camNow = base, curPos = null, curVis = false, n = 0, prevShot = null;
const names = {};
S.forEach((s, si) => {
  const start = t0, end = t0 + s.dur;
  // caption
  if (!s.shot) { t0 = end; return; }
  const ce = mk("capw", fx); const sp = document.createElement("span"); sp.textContent = s.cap; ce.appendChild(sp);
  tl.fromTo(sp, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, start + 0.25);
  if (si < S.length - 1) tl.to(sp, { opacity: 0, duration: 0.3 }, end - 0.3);
  if (!s.shot) { t0 = end; return; }
  // step chip
  n++;
  const ch = mk("step", fx, "<b>" + String(n).padStart(2, "0") + "</b>" + s.chip);
  tl.fromTo(ch, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, start + 0.2);
  tl.to(ch, { opacity: 0, duration: 0.25 }, end - 0.15);
  // shot crossfade
  const im = imgs[s.shot];
  if (prevShot && zoomT && CHAP.has(s.shot)) zoomT(imgs[prevShot], im, start, 0.9);
  else if (prevShot) { tl.set(imgs[prevShot], { opacity: 0 }, start + 0.35); tl.fromTo(im, { opacity: 0 }, { opacity: 1, duration: 0.3 }, start); }
  else {
    // First entrance: the dashboard swings up out of 3D space.
    tl.set(im, { opacity: 1 }, 0); tl.to(stage, { opacity: 1, duration: 0.6 }, start);
    tl.fromTo("#stage-l", { transformPerspective: 2400, rotationX: 26, rotationY: -14, z: -380, transformOrigin: "50% 60%" },
      { rotationX: 0, rotationY: 0, z: 0, duration: 1.3, ease: "power3.out" }, start);
  }
  prevShot = s.shot;
  // camera segments
  const bx = P.boxes[s.shot]; let ts = start; const segs = [];
  const fixed = s.segs.reduce((a, g) => a + (g.d || 0), 0), nf = s.segs.filter((g) => !g.d).length;
  s.segs.forEach((g, gi) => {
    const d = g.d || (s.dur - fixed) / nf, cam = camFor(g.b ? bx[g.b] : null);
    const tw = Math.min(0.9, d * 0.8);
    tl.to(stage, { x: cam.x, y: cam.y, scale: cam.k, duration: tw, ease: "power3.inOut" }, ts);
    segs.push({ s: ts, e: ts + d, cam });
    if (g.t && g.b) {
      const b = bx[g.b], [rx, ry] = toRoot(cam, b.x, b.y), rw = b.w * cam.k, rh = b.h * cam.k, pad = 8;
      const ring = mk("ring", fx); ring.style.cssText += `left:${rx - pad}px;top:${ry - pad}px;width:${rw + 2 * pad}px;height:${rh + 2 * pad}px`;
      const tag = mk("tag", fx); tag.textContent = g.t;
      let ty = ry - pad - 58; if (ty < 104) ty = ry + rh + pad + 14; if (ty > 920) ty = ry + 18;
      tag.style.left = Math.max(56, Math.min(rx, 1920 - 520)) + "px"; tag.style.top = ty + "px";
      const a = ts + tw * 0.7, z = ts + d - 0.2;
      tl.fromTo(ring, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, a);
      tl.fromTo(tag, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, a + 0.1);
      tl.to([ring, tag], { opacity: 0, duration: 0.25 }, z);
    }
    ts += d;
  });
  if (!segs.length) segs.push({ s: start, e: end, cam: camNow });
  camNow = segs[segs.length - 1].cam;
  // cursor
  const segAt = (t) => segs.find((g) => t >= g.s && t < g.e) || segs[segs.length - 1];
  const pt = (to, cam) => { const nm = typeof to === "string" ? to : to[0], b = bx[nm]; const fx_ = typeof to === "string" ? 0.5 : to[1], fy = typeof to === "string" ? 0.5 : to[2]; return toRoot(cam, b.x + b.w * fx_, b.y + b.h * fy); };
  s.cur.forEach((c) => {
    const at = start + c.at, cam = segAt(at).cam;
    if (c.to) {
      const [x, y] = pt(c.to, cam);
      if (!curVis) { tl.set(cur, { x: x - 260, y: y + 190 }, at - 0.4); tl.to(cur, { opacity: 1, duration: 0.3 }, at - 0.4); curVis = true; }
      tl.to(cur, { x, y, duration: c.dur || 0.9, ease: "power2.inOut" }, at);
      curPos = [x, y];
    }
    if (c.click) {
      const r = mk("rip", fx); tl.set(r, { x: curPos[0], y: curPos[1], opacity: 0 }, 0);
      tl.fromTo(r, { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.7, duration: 0.6, ease: "power2.out", immediateRender: false }, at);
      tl.to(cur, { scale: 0.82, duration: 0.1, transformOrigin: "4px 2px" }, at - 0.05);
      tl.to(cur, { scale: 1, duration: 0.15 }, at + 0.05);
    }
  });
  const nxt = S[si + 1];
  if (curVis && !(nxt && nxt.cur.length)) { tl.to(cur, { opacity: 0, duration: 0.3 }, end + 0.5); curVis = false; }
  t0 = end;
});
// intro / outro
const I = S[0].dur, O = t0 - S[S.length - 1].dur;
tl.from("#ie", { y: 20, opacity: 0, duration: 0.5 }, 0.15);
tl.from("#ih", { y: 40, opacity: 0, duration: 0.8, ease: "power3.out" }, 0.35);
tl.from("#is", { y: 20, opacity: 0, duration: 0.6 }, 1.1);
tl.to("#introw", { opacity: 0, duration: 0.5 }, I - 0.5);
tl.from("#oh", { y: 40, opacity: 0, duration: 0.7, ease: "power3.out" }, O + 0.3);
tl.from("#oc", { y: 40, opacity: 0, scale: 0.94, duration: 0.7, ease: "back.out(1.5)" }, O + 0.9);
tl.from("#op", { y: 20, opacity: 0, duration: 0.6 }, O + 1.5);
tl.to(stage, { opacity: 0, duration: 0.6 }, O);
tl.to("#stage-l", { rotationX: -18, rotationY: 10, z: -300, duration: 0.8, ease: "power2.in" }, O - 0.2);
window.__timelines["main"] = tl;
</script>
</body>
</html>
