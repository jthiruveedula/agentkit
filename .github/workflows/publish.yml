# Publishes @jthiruveedula/agentkit to GitHub Packages on every GitHub release.
#
# NOTE: actions are pinned to commit SHAs (version in the trailing comment).
# Majors are the Node 24-based releases: GitHub removed the Node 20 runtime
# from hosted runners in September 2026, so older majors no longer run.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # workflow_dispatch can pick any ref: only ever publish a release tag
    # (release events carry the tag as the ref) or main.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --quiet pytest

      # Build gates -- the publish step never runs if any of these fail.
      - name: Build
        run: make build

      - name: Validate
        run: make validate

      - name: Test
        run: make test

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
