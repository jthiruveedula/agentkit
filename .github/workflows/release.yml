name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Release runs are serialized: two release-please invocations racing on the
# same release PR would conflict.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    # release-please pushes release commits/tags and opens/updates the release
    # PR; the publish trigger below needs to dispatch the publish workflow.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
    steps:
      # Repo policy blocks Actions from opening PRs, so release-please fails at
      # its last step (PR create) after pushing the release branch. Tolerate
      # that one failure; scripts/release-pr.sh opens the PR from the branch.
      - id: release-please
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      - name: Check release-please outcome
        if: steps.release-please.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=release-please--branches--main--components--agentkit
          if gh api "repos/${{ github.repository }}/branches/$branch" --silent; then
            echo "::warning::release PR not opened (Actions can't create PRs); run scripts/release-pr.sh"
          else
            echo "::error::release-please failed before pushing $branch"
            exit 1
          fi

      # Releases cut by the default GITHUB_TOKEN do not trigger downstream
      # `release:` workflows, so publish.yml and pages.yml would never run on
      # their own. Dispatch them explicitly (both support workflow_dispatch).
      - name: Trigger release workflows (publish, deploy site)
        if: steps.release-please.outputs.release_created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release-please.outputs.tag_name }}
        run: |
          # publish ships exactly the tagged code; the github-pages
          # environment only allows main, so the site deploys from main.
          gh workflow run publish.yml --ref "$TAG_NAME" --repo "${{ github.repository }}"
          gh workflow run pages.yml --ref main --repo "${{ github.repository }}"

  # Hands-off releases: run CI on the release PR, merge it when green, then
  # re-run this workflow so release-please tags and publishes. Both steps are
  # explicit because GITHUB_TOKEN-made PRs and merges trigger no workflows.
  # Main needs a green "CI success" but no approving review, so the token can merge.
  automerge:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      BRANCH: release-please--branches--main--components--agentkit
    steps:
      - name: Merge the release PR once CI passes
        run: |
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,headRefOid --jq '.[0] // empty')
          if [ -z "$pr" ]; then echo "no open release PR"; exit 0; fi
          num=$(printf '%s' "$pr" | jq -r .number)
          sha=$(printf '%s' "$pr" | jq -r .headRefOid)

          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          run=""
          for _ in $(seq 1 30); do
            run=$(gh run list --repo "$REPO" --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch \
              --json databaseId,headSha --jq "[.[] | select(.headSha == \"$sha\")][0].databaseId // empty")
            [ -n "$run" ] && break
            sleep 10
          done
          [ -n "$run" ] || { echo "::error::CI run for $sha never started"; exit 1; }
          gh run watch "$run" --repo "$REPO" --exit-status --interval 30 > /dev/null

          # A newer push to main supersedes this PR head; that push's own run merges it.
          if ! gh pr merge "$num" --repo "$REPO" --squash --match-head-commit "$sha"; then
            echo "::warning::release PR #$num moved or is behind main; the next release run retries"
            exit 0
          fi
          gh workflow run release.yml --repo "$REPO" --ref main
