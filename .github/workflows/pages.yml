# Deploys the site to GitHub Pages on every GitHub release, same as publish.yml.
# Merges to main do not deploy; release.yml dispatches this when a release is cut.
name: Deploy site

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Site structure and security checks
        run: python3 site/scripts/check_site.py
      - name: Site security tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/test_site_security.py -q
      - name: Validate site has no obvious secrets or broken structure
        run: |
          test -f site/index.html
          test -f site/assets/logo-sprite.svg
          test -f site/audit/index.html
          python3 -c 'import json;json.load(open("site/assets/audit.json"))'
          ! grep -rIE '(sk-[A-Za-z0-9]{20,}|sk-ant-|ghp_[A-Za-z0-9]{36,}|gho_[A-Za-z0-9]{20,}|xox[abprs]-|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY)' site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
