<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Local-first analytics over your AI coding-assistant sessions." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F6F9FB" />
    <title>Prompt Analytics</title>
    <link rel="icon" href="data:," />
    <script>try{var t=localStorage.getItem("pa-theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;if(t==="dark")document.querySelector('meta[name=theme-color]').content="#081520"}catch(e){}</script>
    <style>html{background:#F6F9FB}html[data-theme=dark]{background:#081520;color-scheme:dark}html,body{margin:0;overflow-x:clip}</style>
  </head>
  <body>
    <div id="root"><main style="font:600 15px/1.4 system-ui,sans-serif;padding:24px 16px"><h1 style="font:inherit;margin:0">Prompt Analytics</h1><p style="font:400 13px/1.5 system-ui,sans-serif;opacity:.7;margin:8px 0 0">Reading your sessions…</p></main></div>
    <script type="application/json" id="pa-data">null</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
