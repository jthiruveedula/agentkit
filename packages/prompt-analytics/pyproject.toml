[project]
name = "prompt-analytics"
version = "0.1.0"
description = "Local-first analytics and dashboard over AI coding-assistant sessions."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "polars>=1.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
embed = ["fastembed>=0.4"]
fast = ["model2vec>=0.3"]
viz = ["umap-learn>=0.5.6"]
ml-full = ["sentence-transformers>=3.0", "bertopic>=0.16"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
prompt-analytics = "prompt_analytics.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_analytics = ["web/**/*", "*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
