[project]
name = "agentkit"
version = "0.1.0"
description = "Portable, vendor-neutral agent foundation for Claude Code, Copilot, Cursor, and Antigravity."
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
agentkit = "agentkit.cli:main"

[project.urls]
Repository = "https://github.com/jthiruveedula/agentkit"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentkit = ["install.sh"]

[tool.ruff]
# Ruff's default rule selection changes between releases, so the selectors are
# pinned (under [tool.ruff.lint]) to keep CI stable. Minimal, py38-compatible.
target-version = "py38"

exclude = [
  # Generated output of scripts/build.py -- never hand-edited, so linting it
  # adds no signal beyond linting the skill sources it is built from.
  "dist/",
  # Ruff's own cache directory.
  ".ruff_cache/",
  # ---- Temporary: files outside CI-hardening ownership that currently fail
  # `ruff check` / `ruff format --check`. Do NOT fix them here; the coordinator
  # is routing fixes to the file owners. Remove each entry once its file is
  # clean (state as of 2026-09-20).
  "scripts/build.py",            # F401 x2; format
  "scripts/lib/frontmatter.py",  # format
  "scripts/validate.py",         # format
  "site/scripts/build-catalog.py",      # format
  "site/scripts/build-logo-sprite.py",  # format
  "skills/data-architect/scripts/adr.py",         # format
  "skills/data-eng-router/scripts/classify.py",   # format
  "skills/memory-sync/scripts/rank_patterns.py",  # F401, E741; format
  "skills/pipeline-scaffold/scripts/scaffold_pipeline.py",  # format
  "skills/prompt-enhancer/scripts/classify.py",   # format
  "skills/skill-forge/scripts/scaffold.py",       # format
  "src/agentkit/cli.py",         # format
  "tests/test_adr.py",                  # format
  "tests/test_build.py",                # format
  "tests/test_data_eng_golden.py",      # format
  "tests/test_golden_intent.py",        # format
  "tests/test_memory_sync.py",          # format
  "tests/test_packaging.py",            # format
  "tests/test_pipeline_scaffold.py",    # format
  "tests/test_validate.py",      # F401; format
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
