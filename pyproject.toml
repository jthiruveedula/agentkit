[project]
name = "agentkit"
version = "0.16.0"
description = "Portable, vendor-neutral agent foundation for Claude Code, Copilot, Cursor, and Antigravity."
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
agentkit = "agentkit.cli:main"

[project.urls]
Repository = "https://github.com/jthiruveedula/agentkit"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentkit = ["install.sh"]

[tool.ruff]
# Ruff's default rule selection changes between releases, so the selectors are
# pinned (under [tool.ruff.lint]) to keep CI stable. Minimal, py38-compatible.
target-version = "py38"

exclude = [
  # Generated output of scripts/build.py -- never hand-edited, so linting it
  # adds no signal beyond linting the skill sources it is built from.
  "dist/",
  # Ruff's own cache directory.
  ".ruff_cache/",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
# Measure shipped code only: test files would otherwise count toward the gate,
# and modules no test imports would be silently left out.
source = ["scripts", "skills", "src", "site/scripts"]
omit = ["*/tests/*", "tests/*", "*/conftest.py"]
