<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#06070a">
<title>agentkit — one kit, every agent</title>
<meta name="description" content="Install the same skills, subagents, and commands into Claude Code, Copilot, Cursor, and Antigravity from one clone. MIT licensed.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='8' fill='%23c6ff3d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#06070a}
a{color:inherit;text-decoration:none}
a:hover{color:#ffffff}
::selection{background:#c6ff3d;color:#06070a}
.gh:hover{color:#06070a;filter:brightness(1.1)}
.hero-copy:hover{border-color:var(--acc)}
.copy-cmd:hover{background:rgba(255,255,255,0.04)}
.after:hover{border-color:var(--acc);color:#ffffff}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
@media (max-width:639px){#hud{display:none}}
</style>
</head>
<body>
<div id="root" style="--acc:#c6ff3d;position:relative;background:#06070a;color:#eceef2;font-family:'JetBrains Mono',ui-monospace,monospace;overflow-x:clip">
  <div aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px);background-size:32px 32px"></div>
  <div aria-hidden="true" id="glow"></div>

  <nav aria-label="Primary" style="position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 18px;border-radius:999px;background:rgba(14,16,20,0.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.09);max-width:calc(100% - 32px);box-sizing:border-box">
    <a href="#core" style="display:flex;align-items:center;gap:8px;font-family:Unbounded,sans-serif;font-weight:800;font-size:13px;letter-spacing:0.04em;margin-right:10px;white-space:nowrap"><span style="width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)"></span>AGENTKIT</a>
    <div id="chapters" style="display:flex;gap:2px;overflow-x:auto"></div>
    <a class="gh" href="https://github.com/jthiruveedula/agentkit" target="_blank" rel="noopener" style="padding:9px 16px;border-radius:999px;background:var(--acc);color:#06070a;font-size:12px;font-weight:600;white-space:nowrap">GitHub ↗</a>
  </nav>

  <div id="hud">
    <div aria-hidden="true" style="position:fixed;left:24px;bottom:20px;z-index:40;display:flex;gap:18px;font-size:10px;letter-spacing:0.14em;color:#5d636d">
      <span><span id="chN">00</span> / 04</span><span><span id="pct">00</span>%</span><span>T+<span id="up">00:00</span></span>
    </div>
    <div aria-hidden="true" id="ticks" style="position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:10px"></div>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">

  <symbol id="logo-cursor" viewBox="0 0 24 24"><path d="M11.503.131 1.891 5.678a.84.84 0 0 0-.42.726v11.188c0 .3.162.575.42.724l9.609 5.55a1 1 0 0 0 .998 0l9.61-5.55a.84.84 0 0 0 .42-.724V6.404a.84.84 0 0 0-.42-.726L12.497.131a1.01 1.01 0 0 0-.996 0M2.657 6.338h18.55c.263 0 .43.287.297.515L12.23 22.918c-.062.107-.229.064-.229-.06V12.335a.59.59 0 0 0-.295-.51l-9.11-5.257c-.109-.063-.064-.23.061-.23" fill="currentColor"></path></symbol>
  <symbol id="logo-antigravity" viewBox="0 0 115 113"><path d="M89.6992 93.695C94.3659 97.195 101.366 94.8617 94.9492 88.445C75.6992 69.7783 79.7825 18.445 55.8659 18.445C31.9492 18.445 36.0325 69.7783 16.7825 88.445C9.78251 95.445 17.3658 97.195 22.0325 93.695C40.1159 81.445 38.9492 59.8617 55.8659 59.8617C72.7825 59.8617 71.6159 81.445 89.6992 93.695Z" fill="currentColor"></path></symbol>
</svg>

  <main style="position:relative;z-index:1">
    <section id="core" style="position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:110px 24px 64px;box-sizing:border-box;gap:28px">
      <a href="https://github.com/jthiruveedula/agentkit/releases/tag/v0.1.0" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid rgba(255,255,255,0.12);font-size:11px;letter-spacing:0.1em;color:#aab0ba">
        <span style="padding:3px 9px;border-radius:999px;background:var(--acc);color:#06070a;font-weight:600">NEW</span>v0.1.0 IS LIVE →
      </a>
      <div id="orbit" aria-hidden="true" style="position:relative;width:min(560px,82vw);aspect-ratio:1"></div>
      <h1 aria-label="One kit. Every agent." style="margin:-8px 0 0;font-family:Unbounded,sans-serif;font-weight:800;font-size:clamp(44px,8vw,120px);line-height:0.9;letter-spacing:-0.04em;text-align:center"><span id="h1a" aria-hidden="true">One kit.</span><br><span id="h1b" aria-hidden="true" style="color:var(--acc)">Every agent.</span></h1>
      <button type="button" id="heroCopy" class="hero-copy" style="display:flex;align-items:center;gap:14px;padding:14px 18px 14px 22px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);color:#eceef2;font:inherit;font-size:14px;cursor:pointer;max-width:100%">
        <span style="color:var(--acc)">$</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">npx github:jthiruveedula/agentkit</span><span id="heroCopyLabel" style="padding:4px 10px;border-radius:8px;background:rgba(255,255,255,0.08);font-size:11px;letter-spacing:0.08em">COPY</span>
      </button>
    </section>

    <section id="build" style="position:relative;height:320vh">
      <div style="position:sticky;top:0;height:100vh;overflow:hidden">
        <div style="position:absolute;top:96px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:4">
          <span id="buildStep" style="font-size:11px;letter-spacing:0.2em;color:var(--acc)">01 — WRITE</span>
          <h2 id="buildWord" style="margin:0;font-family:Unbounded,sans-serif;font-weight:500;font-size:clamp(32px,5vw,72px);letter-spacing:-0.035em;line-height:1">Write once.</h2>
        </div>
        <svg id="buildLines" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"></svg>
        <div id="buildFx" aria-hidden="true"></div>
        <div id="src" aria-hidden="true">
          <span style="font-size:11px;letter-spacing:0.12em;color:#06070a;font-weight:600">SKILL.md</span>
        </div>
      </div>
    </section>

    <section id="skills" style="position:relative;height:240vh">
      <div style="position:sticky;top:0;min-height:100vh;padding:110px 24px 48px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px">
        <h2 style="margin:0;display:flex;align-items:baseline;gap:18px;font-weight:inherit">
          <span id="count" style="font-family:Unbounded,sans-serif;font-weight:800;font-size:clamp(96px,16vw,240px);line-height:0.8;letter-spacing:-0.06em;color:var(--acc)">00</span>
          <span style="font-family:Unbounded,sans-serif;font-weight:300;font-size:clamp(24px,3vw,44px);letter-spacing:-0.02em">skills</span>
        </h2>
        <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;width:min(920px,100%)"></div>
        <div aria-live="polite" style="height:64px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;max-width:620px">
          <span id="hotName" style="font-family:Unbounded,sans-serif;font-weight:500;font-size:18px">&nbsp;</span>
          <span id="hotDesc" style="font-size:12px;line-height:1.5;color:#7d838d"></span>
        </div>
      </div>
    </section>

    <section id="agents" style="position:relative;height:260vh">
      <div style="position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden">
        <div style="position:absolute;top:96px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:3">
          <span id="netStep" style="font-size:11px;letter-spacing:0.2em;color:var(--acc)">01 — PLAN</span>
          <h2 id="netWord" style="margin:0;font-family:Unbounded,sans-serif;font-weight:500;font-size:clamp(32px,5vw,72px);letter-spacing:-0.035em;line-height:1">Plan.</h2>
        </div>
        <div id="net" style="position:relative;width:min(50vh,78vw);aspect-ratio:1;margin-top:40px">
          <svg id="netLines" aria-hidden="true" viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">
            <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.3"></circle>
          </svg>
        </div>
        <div style="position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 48px));display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
          <span id="agentDesc" aria-live="polite" style="font-size:12px;line-height:1.5;color:#9aa0aa"></span>
          <div id="agentTools" style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px"></div>
        </div>
      </div>
    </section>

    <section id="install" style="min-height:100vh;padding:120px 24px 80px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px">
      <h2 style="margin:0;font-family:Unbounded,sans-serif;font-weight:800;font-size:clamp(48px,9vw,140px);letter-spacing:-0.05em;line-height:0.9;text-align:center">Ship it<span style="color:var(--acc)">.</span></h2>
      <div style="width:min(860px,100%);border-radius:18px;border:1px solid rgba(255,255,255,0.1);background:rgba(12,14,18,0.85);overflow:hidden;box-shadow:0 40px 120px -40px var(--acc)">
        <div style="display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.08);flex-wrap:wrap">
          <div id="channels" style="display:contents"></div>
          <span id="activeName" style="margin-left:auto;font-size:10px;letter-spacing:0.14em;color:#5d636d"></span>
        </div>
        <div style="padding:36px 26px;min-height:120px;display:flex;align-items:center">
          <code style="font-family:inherit;font-size:clamp(14px,1.7vw,20px);line-height:1.6;white-space:pre-wrap;word-break:break-all"><span style="color:var(--acc)">$ </span><span id="typed"></span><span id="caret"></span></code>
        </div>
        <button type="button" id="copyCmd" class="copy-cmd" style="display:block;width:100%;padding:16px;border:0;border-top:1px solid rgba(255,255,255,0.08);background:transparent;color:var(--acc);font:inherit;font-size:12px;letter-spacing:0.16em;cursor:pointer">COPY COMMAND</button>
      </div>
      <div id="after" style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px"></div>
    </section>

    <footer style="padding:32px 24px 56px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;letter-spacing:0.1em;color:#5d636d">
      <span>© 2026 JAGADEESH THIRUVEEDULA · MIT · ZERO TELEMETRY</span>
      <a href="https://github.com/jthiruveedula/agentkit" target="_blank" rel="noopener" style="color:var(--acc)">SOURCE ↗</a>
    </footer>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
